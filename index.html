<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  
  <!-- Primary Meta Tags -->
  <title>Dental Clinic | Professional Dental Care Services</title>
  <meta name="title" content="Dental Clinic | Professional Dental Care Services" />
  <meta name="description" content="Our dental clinic provides professional dental care services including general dentistry, cosmetic procedures, and emergency treatments." />
  <meta name="keywords" content="dental clinic, dentist, dental care, teeth cleaning, dental implants, cosmetic dentistry" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.dentalclinic.com/" />
  <meta property="og:title" content="Dental Clinic | Professional Dental Care Services" />
  <meta property="og:description" content="Our dental clinic provides professional dental care services including general dentistry, cosmetic procedures, and emergency treatments." />
  <meta property="og:image" content="/social-preview.jpg" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.dentalclinic.com/" />
  <meta property="twitter:title" content="Dental Clinic | Professional Dental Care Services" />
  <meta property="twitter:description" content="Our dental clinic provides professional dental care services including general dentistry, cosmetic procedures, and emergency treatments." />
  <meta property="twitter:image" content="/social-preview.jpg" />
  
  <!-- Preload critical assets -->
  <!-- Logo will be loaded through regular image tags -->
  
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Font optimization with display=swap -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
    
  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.dentalclinic.com/" />
  
  <!-- Mobile theme color -->
  <meta name="theme-color" content="#4a90e2" />
</head>

<body>
  <div id="root"></div>
  
  <!-- Critical rendering path scripts -->
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Service worker registration (for offline capabilities) -->
  <script src="/register-sw.js" defer></script>
  
  <!-- Non-critical scripts loaded after page render -->
  <!-- Analytics is now loaded through service worker cache -->
  
  <!-- Structured data for organization -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Dentist",
      "name": "Dental Clinic",
      "image": "https://www.dentalclinic.com/logo.png",
      "@id": "https://www.dentalclinic.com",
      "url": "https://www.dentalclinic.com",
      "telephone": "+90-212-555-1234",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Dental Street",
        "addressLocality": "Istanbul",
        "addressRegion": "Istanbul",
        "postalCode": "34000",
        "addressCountry": "TR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 41.0082,
        "longitude": 28.9784
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "10:00",
          "closes": "15:00"
        }
      ],
      "sameAs": [
        "https://www.facebook.com/dentalclinic",
        "https://www.instagram.com/dentalclinic",
        "https://twitter.com/dentalclinic"
      ]
    }
  </script>
</body>

</html>
